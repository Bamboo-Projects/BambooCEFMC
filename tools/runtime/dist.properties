# Was ausgeliefert wird — geschrieben von package-runtime.ps1, eingecheckt.
#
# <b>Warum eingecheckt und nicht beim Bauen erzeugt.</b> Die Mod muss wissen,
# welche Fassung sie erwartet und welche Prüfsumme dazugehört, bevor irgendwer
# gepackt hat. Stünde das nur im Ergebnis eines Paketierlaufs, könnte niemand
# die Mod bauen, ohne vorher 173 Megabyte zu packen.
#
# <b>Je Plattform ein eigener Schlüssel.</b> Fehlt der Schlüssel für die
# Plattform, auf der jemand spielt, ist das kein Fehler, sondern eine Auskunft:
# Für diese Plattform gibt es keine Binärdateien. Eine flache Datei könnte das
# nicht unterscheiden.
#
# Die Adresse zeigt in den R2-Bucket bamboocef (Unterordner je Plattform,
# hier minecraft/neoforge), angebunden über bamboocef.bamboo-srv.de. Leer wäre auch gültig und hieße für den
# Client: nur lokal suchen, nichts herunterladen.

runtime.version=146.0.10
runtime.base-url=https://bamboocef.bamboo-srv.de/minecraft/neoforge

