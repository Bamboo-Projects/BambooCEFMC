modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Die CEF-basierte Web-Runtime für Minecraft: startet Chromium ohne Fenster,
lädt Seiten als Textur in die Welt und reicht Eingaben durch. Eine Java-API
für Overlays, Bildschirme und Flächen in der Welt — für diese Mod und für
fremde Mods.
'''

[[mixins]]
config = "bamboocef.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2]"
ordering = "NONE"
side = "CLIENT"
