plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Die native Laufzeitumgebung (java-cef) baut tools/runtime/build-jcef.ps1.
// Ab hier ist sie Voraussetzung für den Bau: ohne sie fehlt jcef.jar.
def ownRuntimeDir = file('tools/runtime/build/out/windows-x86_64')

// Der java-cef-Unterbau lebt in einem eigenen Quellordner neben src/main.
sourceSets.main.java.srcDir('src/runtime/java')

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'bamboocef.runtime.dir', ownRuntimeDir.absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Die Unit-Tests brauchen dieselben Minecraft-Klassen wie der Hauptcode
    // (LWJGL/GLFW, Rendertypen). Ohne das fehlt dem Testquellsatz die
    // Client-Seite und die Filter-/Eingabe-Prüfläufe übersetzen nicht.
    addModdingDependenciesTo sourceSets.test
}

dependencies {
    // jcef.jar auf den Laufzeit-Klassenpfad des Dev-Clients.
    add(neoForge.runs.client.additionalRuntimeClasspathConfiguration.name,
            files(new File(ownRuntimeDir, 'jcef.jar')))
}

dependencies {
    if (!ownRuntimeDir.exists()) {
        throw new GradleException("Keine Laufzeitumgebung unter ${ownRuntimeDir}. "
                + "Erst: pwsh -File tools/runtime/build-jcef.ps1")
    }
    compileOnly files(new File(ownRuntimeDir, 'jcef.jar'))
    runtimeOnly files(new File(ownRuntimeDir, 'jcef.jar'))

    compileOnly 'net.java.dev.jna:jna:5.14.0'
    compileOnly 'net.java.dev.jna:jna-platform:5.14.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

processResources {
    def expandProps = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            neo_version: neo_version,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    // Was ausgeliefert wird, muss die Mod wissen: tools/runtime/dist.properties
    // wird als /bamboocef-runtime.properties eingebettet, RuntimeManifest liest sie.
    from('tools/runtime/dist.properties') {
        rename { 'bamboocef-runtime.properties' }
    }
}
