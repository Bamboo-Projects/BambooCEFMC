name: Publish

# Runs when a GitHub release is published (the /release flow creates it from
# a tag). Builds the jar from that tag and uploads it to Modrinth — and to
# CurseForge as well, once that project and its token exist. A platform
# without a token is skipped, so the first releases can go to Modrinth alone.
#
# Needs (organisation or repository level):
#   variables  MODRINTH_PROJECT_ID, CURSEFORGE_PROJECT_ID
#   secrets    MODRINTH_TOKEN, CURSEFORGE_TOKEN
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - run: ./gradlew build --no-daemon

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/!(*-sources|*-javadoc).jar
          name: BambooCEF ${{ github.event.release.tag_name || github.ref_name }}
          # Early library: every 0.x release is a beta on the platforms.
          version-type: beta
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          # The changelog is the body of the GitHub release.
          changelog: ${{ github.event.release.body }}
