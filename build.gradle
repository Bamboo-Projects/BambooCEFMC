plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    // The Java bindings of CEF live in the project's own bucket: they are on
    // no public Maven, and CI must compile without a local native build.
    maven {
        url = 'https://bamboocef.bamboo-srv.de/maven'
        content { includeGroup 'org.cef' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The native runtime (tools/runtime/build-jcef.ps1) is only needed to RUN the
// dev client; compiling and testing work without it. When it is missing,
// the client run falls back to the download, like a player's game does.
def ownRuntimeDir = file('tools/runtime/build/out/windows-x86_64')

// Der java-cef-Unterbau lebt in einem eigenen Quellordner neben src/main.
sourceSets.main.java.srcDir('src/runtime/java')

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            if (ownRuntimeDir.exists()) {
                systemProperty 'bamboocef.runtime.dir', ownRuntimeDir.absolutePath
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Die Unit-Tests brauchen dieselben Minecraft-Klassen wie der Hauptcode
    // (LWJGL/GLFW, Rendertypen). Ohne das fehlt dem Testquellsatz die
    // Client-Seite und die Filter-/Eingabe-Prüfläufe übersetzen nicht.
    addModdingDependenciesTo sourceSets.test
}

dependencies {
    // The mod itself is loaded from class folders in the dev run, so the
    // nested jar below is not there; the bindings go on the run classpath.
    add(neoForge.runs.client.additionalRuntimeClasspathConfiguration.name,
            "org.cef:jcef:${jcef_version}")
}

dependencies {
    // Compile against the CEF bindings and nest them into the mod jar
    // (jar-in-jar): a player's game then has org.cef without any extra
    // download step, while the native libraries still arrive separately.
    compileOnly "org.cef:jcef:${jcef_version}"
    jarJar("org.cef:jcef:${jcef_version}") {
        version {
            strictly "[${jcef_version},147.0)"
            prefer jcef_version
        }
    }
    testRuntimeOnly "org.cef:jcef:${jcef_version}"

    compileOnly 'net.java.dev.jna:jna:5.14.0'
    compileOnly 'net.java.dev.jna:jna-platform:5.14.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

processResources {
    def expandProps = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            neo_version: neo_version,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    // Was ausgeliefert wird, muss die Mod wissen: tools/runtime/dist.properties
    // wird als /bamboocef-runtime.properties eingebettet, RuntimeManifest liest sie.
    from('tools/runtime/dist.properties') {
        rename { 'bamboocef-runtime.properties' }
    }
}
